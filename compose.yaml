name: taskplan

services:
  postgres:
    image: postgres:17-alpine
    container_name: taskplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [taskplan-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: taskplan-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment: { TZ: America/Sao_Paulo }
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks: [taskplan-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taskplan-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [taskplan-network]
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    build: { context: ./backend, dockerfile: Dockerfile }
    image: taskplan-backend:${TASKPLAN_RELEASE:-local}
    container_name: taskplan-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN_SECONDS: ${JWT_REFRESH_EXPIRES_IN_SECONDS}
      CORS_ORIGIN: ${CORS_ORIGIN}
      TZ: America/Sao_Paulo
    ports:
      - "192.168.100.15:5183:3000"
    networks: [taskplan-network]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 15s

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    image: taskplan-frontend:${TASKPLAN_RELEASE:-local}
    container_name: taskplan-frontend
    restart: unless-stopped
    environment:
      TASKPLAN_API_URL: ${TASKPLAN_API_URL:-http://192.168.100.15:5183/api}
    ports:
      - "192.168.100.15:5182:8080"
    networks: [taskplan-network]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  postgres_data: { name: taskplan-postgres-data }
  redis_data: { name: taskplan-redis-data }
  pgadmin_data: { name: taskplan-pgadmin-data }

networks:
  taskplan-network: { name: taskplan-network, driver: bridge }