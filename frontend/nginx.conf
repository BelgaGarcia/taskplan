server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 resolver 127.0.0.11 ipv6=off valid=10s;
 location = /healthz { access_log off; add_header Cache-Control "no-store"; return 200 "ok\n"; }
 location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
 location = /assets/runtime-config.json { add_header Cache-Control "no-store"; }
  location = /assets/runtime-config.js { add_header Cache-Control "no-store"; }
 location /api/ {
  set $taskplan_backend http://backend:3000;
  proxy_pass $taskplan_backend;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location / { try_files $uri $uri/ /index.html; }
}
