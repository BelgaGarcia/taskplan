name: TaskPlan quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      compose: ${{ steps.filter.outputs.compose }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            compose:
              - 'compose.yaml'
              - '.env.example'
              - 'ops/**'
            shared:
              - '.github/workflows/**'
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.7
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build -- --configuration production
      - run: docker build --tag taskplan-frontend:${{ github.sha }} .
      - run: npx playwright install --with-deps chromium
      - name: Start frontend with a private API smoke server
        run: |
          docker network create taskplan-ui
          docker run --detach --rm --name taskplan-backend-ui --network taskplan-ui --network-alias backend node:24-alpine \
            node -e "require('http').createServer((request, response) => { response.writeHead(request.url === '/api/health' ? 200 : 404); response.end('ok'); }).listen(3000)"
          docker run --detach --rm --name taskplan-frontend-ui --network taskplan-ui -p 127.0.0.1:8080:8080 taskplan-frontend:${{ github.sha }}
      - run: |
          for ((attempt = 1; attempt <= 30; attempt++)); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs taskplan-frontend-ui
          exit 1
      - name: Verify the same-origin API proxy
        run: curl --fail --silent --show-error http://127.0.0.1:8080/api/health
      - run: npm run test:ui
        env: { TASKPLAN_UI_BASE_URL: http://127.0.0.1:8080 }
      - if: always()
        run: |
          docker stop taskplan-frontend-ui taskplan-backend-ui || true
          docker network rm taskplan-ui || true
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build
      - run: docker build --tag taskplan-backend:${{ github.sha }} .
  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
