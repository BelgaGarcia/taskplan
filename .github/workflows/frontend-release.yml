name: TaskPlan production release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Stable release tag to deploy (for example, v0.2.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: release
        name: Validate immutable stable SemVer release from main
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="$(jq -r .release.tag_name "$GITHUB_EVENT_PATH")"
            test "$(jq -r .release.draft "$GITHUB_EVENT_PATH")" = false
            test "$(jq -r .release.prerelease "$GITHUB_EVENT_PATH")" = false
          else
            VERSION="${{ inputs.version }}"
          fi
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --tags --force
          SHA="$(git rev-list -n 1 "$VERSION")"
          test -n "$SHA"
          git merge-base --is-ancestor "$SHA" origin/main
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test -- --watch=false
        working-directory: frontend
      - run: npm run build -- --configuration production
        working-directory: frontend
      - run: docker build --tag taskplan-frontend:validation frontend
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm test -- --runInBand
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: docker build --tag taskplan-backend:validation backend
      - run: docker compose --env-file .env.example config --quiet
  production:
    needs: validate
    runs-on: [self-hosted, linux, x64, taskplan-prod]
    environment: production
    steps:
      - name: Deploy the coordinated TaskPlan release
        run: sudo -n -- /usr/local/sbin/taskplan-deploy '${{ needs.validate.outputs.version }}' '${{ needs.validate.outputs.sha }}'
